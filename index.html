<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1">
<title>maneko UI preview</title>
<style>
:root{
  --bg:#f7f5f1;--surface:#fffefa;--surface2:#f0ece6;--ink:#24211f;--muted:#736d67;--line:#e4ded7;
  --accent:#2f2a27;--soft:#ebe3da;--shadow:0 16px 40px rgba(36,33,31,.08);--safe:max(14px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:#dcd7d0}
button,input,textarea{font:inherit}button{color:inherit}.phone{position:relative;width:min(430px,100%);height:min(900px,calc(100dvh - 40px));margin:20px auto;background:var(--bg);border-radius:42px;overflow:hidden;box-shadow:0 28px 80px rgba(36,33,31,.18);border:1px solid rgba(36,33,31,.06)}
.app{height:100%;width:100%;max-width:100%;overflow:auto;overflow-x:hidden;padding:26px 20px 120px;scrollbar-width:none}.app::-webkit-scrollbar{display:none}.screen{display:none}.screen.active{display:block;animation:fade .16s ease}@keyframes fade{from{opacity:.6;transform:translateY(2px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.page-head h1{font-size:30px;line-height:1.1;letter-spacing:-.9px;margin:0}.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;font-size:21px;cursor:pointer}
.focus-card{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow)}.context{display:inline-flex;padding:7px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:760;color:#5f5751}.focus-title{font-size:24px;line-height:1.42;letter-spacing:-.5px;font-weight:830;margin-top:16px}.source{font-size:13px;color:var(--muted);margin-top:10px;font-weight:620}.action-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:22px}.primary{min-width:0;border:0;background:var(--accent);color:white;border-radius:17px;padding:15px 18px;font-weight:820;cursor:pointer}.secondary{border:1px solid #d8d0c8;background:#fff;border-radius:17px;padding:0 16px;font-weight:800;cursor:pointer}
.section-label{font-size:13px;font-weight:800;color:var(--muted);margin:26px 2px 10px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}.row{display:flex;gap:13px;align-items:center}.row.start{align-items:flex-start}.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}.grow{flex:1;min-width:0}.badge{width:38px;height:38px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto;font-size:18px}.title{font-size:17px;line-height:1.45;font-weight:800}.body{font-size:13px;line-height:1.55;color:var(--muted);margin-top:4px}.text-action{border:0;background:transparent;padding:0;margin-top:14px;font-size:13px;font-weight:820;cursor:pointer}.status{display:inline-flex;padding:7px 10px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:760;color:#5f5751}
.search{width:100%;border:0;background:#ece8e2;border-radius:17px;padding:14px 15px;text-align:left;color:var(--muted);font-size:14px;cursor:pointer}.stack{display:flex;flex-direction:column;gap:11px}.role-card{cursor:pointer}.role-avatar{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#e9dfd4,#d9e0d9);display:grid;place-items:center;font-weight:850;font-size:20px;flex:0 0 auto}.role-focus{font-size:14px;font-weight:760;line-height:1.5;margin-top:14px}.role-meta{font-size:12px;color:var(--muted);margin-top:3px}
.tabs{position:absolute;left:16px;right:16px;bottom:var(--safe);height:70px;z-index:20;background:rgba(252,249,245,.92);backdrop-filter:blur(20px);border:1px solid #e2dcd5;border-radius:26px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 9px 28px rgba(36,33,31,.08)}.tab{border:0;background:transparent;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8a837d;font-size:11px;font-weight:700;cursor:pointer}.tab.active{background:#e8dfd5;color:var(--ink)}.tab i{font-style:normal;font-size:18px;line-height:1}
.help-card{position:absolute;left:16px;right:16px;bottom:calc(var(--safe) + 80px);z-index:25;background:var(--surface);border:1px solid #ddd5cd;border-radius:20px;padding:14px 14px 14px 16px;display:none;align-items:center;gap:12px;box-shadow:0 14px 34px rgba(36,33,31,.13)}.help-card.show{display:flex}.help-copy{flex:1;min-width:0}.help-title{font-size:14px;font-weight:830}.help-desc{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}.help-link{border:0;background:transparent;padding:0;margin-top:7px;font-size:13px;font-weight:820;cursor:pointer}.help-close{width:34px;height:34px;border:0;border-radius:50%;background:var(--surface2);font-size:18px;cursor:pointer}
.modal-layer{position:absolute;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(36,33,31,.25);backdrop-filter:blur(2px)}.modal-layer.open{display:flex}.sheet{width:100%;max-height:88%;overflow:auto;background:#fbfaf8;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -18px 48px rgba(36,33,31,.18)}.handle{width:40px;height:5px;background:#d4cec8;border-radius:999px;margin:0 auto 18px}.sheet h2{font-size:26px;letter-spacing:-.6px;margin:0 0 8px}.field{width:100%;border:1px solid #dcd5ce;background:white;border-radius:15px;padding:14px;outline:none;margin:8px 0 12px;resize:vertical}.choice-wrap{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.choice{border:1px solid #dcd5ce;background:white;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:730;cursor:pointer}.choice.selected{background:var(--accent);border-color:var(--accent);color:white}.sheet-row{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 0;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer}.sheet-row:last-child{border-bottom:0}.detail{display:none;position:absolute;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:20px 20px 44px}.detail.active{display:block}.back{border:0;background:transparent;font-size:26px;padding:6px 8px 6px 0;cursor:pointer}.detail-avatar{width:72px;height:72px;border-radius:23px;background:linear-gradient(135deg,#e9dfd4,#d9e0d9);display:grid;place-items:center;font-size:28px;font-weight:850;margin:8px 0 18px}.toast{position:absolute;left:22px;right:22px;bottom:100px;z-index:90;background:var(--accent);color:white;border-radius:15px;padding:12px 15px;font-size:13px;font-weight:720;box-shadow:0 12px 30px rgba(36,33,31,.16);opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}
@media(max-width:520px){html,body{background:var(--bg)}.phone{width:100%;height:100dvh;margin:0;border-radius:0;border:0;box-shadow:none}.app{padding-top:max(22px,env(safe-area-inset-top))}.detail{padding-top:max(18px,env(safe-area-inset-top))}}
</style>
</head>
<body>
<main class="phone">
  <div class="app" id="app">
    <section class="screen active" data-screen="today" id="today"></section>
    <section class="screen" data-screen="models" id="models"></section>
    <section class="screen" data-screen="me" id="me"></section>
  </div>

  <aside class="help-card" id="help-card">
    <div class="help-copy">
      <div class="help-title">使い方を見る</div>
      <div class="help-desc">お手本から借りて、自分の形にする流れを3ステップで。</div>
      <button class="help-link" data-action="help">3ステップを見る →</button>
    </div>
    <button class="help-close" data-action="dismiss-help" aria-label="閉じる">×</button>
  </aside>

  <nav class="tabs" aria-label="メインナビゲーション">
    <button class="tab active" data-tab="today"><i>☀︎</i><span>今日</span></button>
    <button class="tab" data-tab="models"><i>✦</i><span>お手本</span></button>
    <button class="tab" data-tab="me"><i>◉</i><span>わたし</span></button>
  </nav>

  <section class="detail" id="detail"></section>
  <div class="modal-layer" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</main>
<script>
(() => {
  const initial = () => ({
    tab:'today',
    showHelp:localStorage.getItem('maneko_help_dismissed')!=='1',
    aspiration:{title:'忙しくても、重要なことから進められる人',detail:'仕事が重なると、何から手を付けるか迷う'},
    trial:{text:'仕事を始める前に、今日一番重要なことを1つ書く',context:'次に仕事を始めるとき',role:'未来の自分'},
    logs:[],adaptations:[],selectedResult:null,
    roles:[
      {id:'future',name:'未来の自分',kind:'あなたが描いたお手本',official:false,description:'忙しい日でも、重要なことを見失わずに動ける自分。',focus:'重要なことを先に決めるところ',reason:'判断を後回しにせず、始める前に優先順位を1つだけ決める。',wayTitle:'最初に試すこと',way:'仕事を始める前に、今日一番重要なことを1つ書く'},
      {id:'editorial',name:'編集部のお手本',kind:'公式のお手本',official:true,description:'止まらないことより、止まったあとに戻りやすくする考え方。',focus:'完璧より、再開しやすさを大事にするところ',reason:'一度できなかったことを失敗にせず、次の一歩を小さくする。',wayTitle:'続かなかった日は最小版に戻す',way:'止まった翌日は、元の量ではなく「5分だけ」など最小版から再開する。'}
    ]
  });
  let state=initial();
  const params=new URLSearchParams(location.search);
  if(['today','models','me'].includes(params.get('tab'))) state.tab=params.get('tab');
  if(params.get('help')==='0') state.showHelp=false;
  const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
  const esc=(s='')=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const label=t=>`<div class="section-label">${esc(t)}</div>`;
  const resultLabel=v=>({done:'できた',partial:'少しできた',skipped:'今日はしなかった',notSuitable:'合わなかった'})[v]||v;

  function renderToday(){
    const last=state.logs.at(-1), adapted=state.adaptations.length>0;
    $('#today').innerHTML=`
      <header class="page-head"><h1>今日</h1></header>
      <article class="focus-card">
        <span class="context">${esc(state.trial.context)}</span>
        <div class="focus-title">${esc(state.trial.text)}</div>
        <div class="source">${esc(state.trial.role)} を参考にしています</div>
        <div class="action-row">
          <button class="primary" data-action="record">${last?'今日の記録を見る':'試して記録する'}</button>
          <button class="secondary" data-action="adapt">調整</button>
        </div>
      </article>
      ${label('なりたい姿')}
      <article class="card row start"><div class="badge">↗</div><div class="grow"><div class="title">${esc(state.aspiration.title)}</div><div class="body">${esc(state.aspiration.detail)}</div></div></article>
      ${last?`${label('気づき')}<article class="card"><div class="title">${adapted?'少し自分向けになってきました':'次は、できた場面を見てみる'}</div><div class="body">${adapted?'変更した内容をもとに、前より自然にできたかを確かめます。':'結果だけでなく、どんな場面なら自然にできたかを残すと調整しやすくなります。'}</div><button class="text-action" data-action="adapt">自分に合わせる →</button></article><div class="body" style="margin:12px 2px 0">直近：${esc(resultLabel(last.result))}${last.note?` · ${esc(last.note)}`:''}</div>`:`<button class="text-action" style="margin:18px 2px 0" data-action="go-models">別のお手本を探す →</button>`}
    `;
  }
  function roleCard(r){return `<article class="card role-card" data-role="${esc(r.id)}"><div class="row"><div class="role-avatar">${esc(r.name.slice(0,1))}</div><div class="grow"><div class="title">${esc(r.name)}${r.official?' ✓':''}</div><div class="role-meta">${esc(r.kind)}</div></div><div>›</div></div><div class="role-focus">${esc(r.focus)}</div></article>`}
  function renderModels(){
    $('#models').innerHTML=`<header class="page-head"><h1>お手本</h1><button class="icon-btn" data-action="add-role" aria-label="お手本を追加">＋</button></header><button class="search" data-action="search">⌕　お手本を探す</button>${label('参考にしている')}<div class="stack">${state.roles.map(roleCard).join('')}</div>`;
  }
  function renderMe(){
    $('#me').innerHTML=`
      <header class="page-head"><h1>わたし</h1><button class="icon-btn" data-action="settings" aria-label="設定">⚙︎</button></header>
      ${label('なりたい姿')}<article class="card"><div class="title" style="font-size:20px">${esc(state.aspiration.title)}</div><div class="body">${esc(state.aspiration.detail)}</div><button class="text-action" data-action="edit-aspiration">編集 →</button></article>
      ${label('いま試している')}<article class="card"><div class="row-between"><span class="status">試している</span><button class="text-action" style="margin:0" data-action="adapt">調整</button></div><div class="title" style="margin-top:10px">${esc(state.trial.text)}</div><div class="body">${esc(state.trial.role)} から始めたやり方</div></article>
      ${label('自分に合ってきたこと')}${state.adaptations.length?state.adaptations.slice().reverse().map(a=>`<article class="card row start" style="margin-bottom:10px"><div class="badge">✓</div><div class="grow"><div class="title">${esc(a.after)}</div><div class="body">${esc(a.reason||'試しながら、自分向けに変更しました。')}</div></div></article>`).join(''):`<article class="card row start"><div class="badge">◌</div><div class="body">調整した内容がここに残ります。</div></article>`}
    `;
  }
  function render(){renderToday();renderModels();renderMe();$$('.screen').forEach(x=>x.classList.toggle('active',x.dataset.screen===state.tab));$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));$('#help-card').classList.toggle('show',state.showHelp)}
  function setTab(tab){state.tab=tab;render();$('#app').scrollTo({top:0,behavior:'smooth'})}
  function openSheet(html){$('#sheet').innerHTML=`<div class="handle"></div>${html}`;$('#modal').classList.add('open')}
  function closeSheet(){$('#modal').classList.remove('open')}
  function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1900)}

  function help(){openSheet(`<h2>使い方</h2><div class="stack" style="margin:18px 0 22px"><div class="row start"><div class="badge">1</div><div><div class="title">お手本から、ひとつ借りる</div><div class="body">人物全体ではなく、取り入れたい考え方や行動を選びます。</div></div></div><div class="row start"><div class="badge">2</div><div><div class="title">一度だけ試す</div><div class="body">続ける前提にせず、生活の中で自分に合うか確かめます。</div></div></div><div class="row start"><div class="badge">3</div><div><div class="title">自分の形に変える</div><div class="body">合わない部分だけ調整し、しっくりきたやり方を残します。</div></div></div></div><button class="primary" style="width:100%" data-sheet="close">わかった</button>`)}
  function record(){const last=state.logs.at(-1);if(last){openSheet(`<h2>今日の記録</h2><div class="body">${esc(state.trial.text)}</div><div class="card" style="margin:18px 0"><div class="title">${esc(resultLabel(last.result))}</div>${last.note?`<div class="body">${esc(last.note)}</div>`:''}</div><button class="primary" style="width:100%" data-sheet="record-again">もう一度記録する</button>`);return}openRecord()}
  function openRecord(){state.selectedResult=null;openSheet(`<h2>どうでしたか？</h2><div class="body">${esc(state.trial.text)}</div><div class="choice-wrap">${[['done','できた'],['partial','少しできた'],['skipped','今日はしなかった'],['notSuitable','合わなかった']].map(([v,l])=>`<button class="choice" data-result="${v}">${l}</button>`).join('')}</div><textarea class="field" id="note" rows="3" placeholder="ひとこと（任意）"></textarea><button class="primary" style="width:100%;opacity:.45" id="save-log" disabled data-sheet="save-log">記録する</button>`)}
  function adapt(){openSheet(`<h2>自分に合わせる</h2><div class="body">元の形は残ります。合わない部分だけ変えます。</div><textarea class="field" id="adapt-text" rows="4">${esc(state.trial.text)}</textarea><input class="field" id="adapt-reason" placeholder="なぜ変える？（任意）"><button class="primary" style="width:100%" data-sheet="save-adapt">この形で次に試す</button>`)}
  function search(){openSheet(`<h2>お手本を探す</h2><input class="field" autofocus placeholder="例：落ち着いて判断できる人"><div class="body">このモックでは登録済みのお手本を表示します。</div>`);setTimeout(()=>$('#sheet input')?.focus(),80)}
  function settings(){openSheet(`<h2>設定</h2><button class="sheet-row" data-sheet="help"><span class="badge">?</span><span class="grow"><b>使い方を見る</b><br><span class="body">いつでも確認できます</span></span><span>›</span></button><button class="sheet-row" data-sheet="reset"><span class="badge">↻</span><span class="grow"><b>モックを初期状態に戻す</b></span></button>`)}
  function addRole(){openSheet(`<h2>お手本を追加</h2><input class="field" id="role-name" placeholder="名前"><input class="field" id="role-focus" placeholder="どこを参考にしたい？"><button class="primary" style="width:100%" data-sheet="save-role">追加する</button>`)}
  function editAspiration(){openSheet(`<h2>なりたい姿を編集</h2><input class="field" id="asp-title" value="${esc(state.aspiration.title)}"><textarea class="field" id="asp-detail" rows="3">${esc(state.aspiration.detail)}</textarea><button class="primary" style="width:100%" data-sheet="save-asp">保存する</button>`)}
  function openRole(id){const r=state.roles.find(x=>x.id===id);if(!r)return;$('#detail').innerHTML=`<button class="back" data-detail="back">‹</button><div class="detail-avatar">${esc(r.name.slice(0,1))}</div><div class="page-head" style="margin-bottom:6px"><h1>${esc(r.name)}${r.official?' ✓':''}</h1></div><div class="body" style="font-size:14px">${esc(r.description)}</div>${label('ここを借りる')}<article class="card"><div class="title">${esc(r.focus)}</div><div class="body">${esc(r.reason)}</div></article>${label('試せるやり方')}<article class="card"><div class="title">${esc(r.wayTitle)}</div><div class="body" style="font-size:14px;margin-top:7px">${esc(r.way)}</div><button class="primary" style="margin-top:16px" data-detail="try" data-role-id="${esc(r.id)}">これを試す</button></article>`;$('#detail').classList.add('active');$('#detail').scrollTop=0}
  function closeRole(){$('#detail').classList.remove('active')}

  document.addEventListener('click',e=>{
    const tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}
    const role=e.target.closest('[data-role]');if(role){openRole(role.dataset.role);return}
    const action=e.target.closest('[data-action]')?.dataset.action;
    if(action){
      if(action==='record')record(); else if(action==='adapt')adapt(); else if(action==='go-models')setTab('models'); else if(action==='search')search(); else if(action==='settings')settings(); else if(action==='add-role')addRole(); else if(action==='edit-aspiration')editAspiration(); else if(action==='help')help(); else if(action==='dismiss-help'){state.showHelp=false;localStorage.setItem('maneko_help_dismissed','1');render();toast('「わたし」→ 設定 → 使い方 からいつでも見られます')}
      return;
    }
    const result=e.target.closest('[data-result]');if(result){state.selectedResult=result.dataset.result;$$('.choice','#sheet').forEach(x=>x.classList.toggle('selected',x.dataset.result===state.selectedResult));const b=$('#save-log');b.disabled=false;b.style.opacity='1';return}
    const d=e.target.closest('[data-detail]');if(d){if(d.dataset.detail==='back')closeRole();if(d.dataset.detail==='try'){const r=state.roles.find(x=>x.id===d.dataset.roleId);if(r){state.trial.text=r.way;state.trial.role=r.name;closeRole();setTab('today');toast('「今日」に追加しました')}}return}
    const sa=e.target.closest('[data-sheet]')?.dataset.sheet;if(sa){
      if(sa==='close'){closeSheet();return}if(sa==='help'){closeSheet();setTimeout(help,70);return}if(sa==='record-again'){closeSheet();setTimeout(openRecord,70);return}
      if(sa==='save-log'){if(!state.selectedResult)return;const result=state.selectedResult,note=$('#note')?.value.trim()||'';state.logs.push({result,note,at:new Date().toISOString()});closeSheet();render();toast('記録しました');if(result==='partial'||result==='notSuitable')setTimeout(adapt,260);return}
      if(sa==='save-adapt'){const after=$('#adapt-text')?.value.trim();if(!after)return;state.adaptations.push({before:state.trial.text,after,reason:$('#adapt-reason')?.value.trim()||''});state.trial.text=after;closeSheet();render();toast('次に試す形を更新しました');return}
      if(sa==='save-role'){const name=$('#role-name')?.value.trim(),focus=$('#role-focus')?.value.trim();if(!name||!focus){toast('名前と、参考にしたい点を入力してください');return}state.roles.push({id:'custom-'+Date.now(),name,kind:'自分で追加',official:false,description:'あなたが追加したお手本です。',focus,reason:'自分が良いと感じた具体的な点。',wayTitle:'まず一度試す',way:`${focus}を、次の機会に一度だけ意識する`});closeSheet();render();toast('お手本を追加しました');return}
      if(sa==='save-asp'){const t=$('#asp-title')?.value.trim();if(!t)return;state.aspiration.title=t;state.aspiration.detail=$('#asp-detail')?.value.trim()||'';closeSheet();render();toast('なりたい姿を更新しました');return}
      if(sa==='reset'){localStorage.removeItem('maneko_help_dismissed');state=initial();closeSheet();closeRole();render();toast('初期状態に戻しました');return}
    }
    if(e.target===$('#modal'))closeSheet();
  });
  render();
})();
</script>
</body>
</html>
